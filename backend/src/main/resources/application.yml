server:
  port: ${PORT:8080}
  shutdown: graceful

spring:
  application:
    name: wellness-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:54322/postgres}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:10}
      minimum-idle: ${DATABASE_MIN_IDLE:2}
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration/core,classpath:db/migration/engagement
    validate-on-migrate: true
  lifecycle:
    timeout-per-shutdown-phase: 20s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  supabase:
    url: ${SUPABASE_URL:http://localhost:54321}
    jwt-issuer: ${SUPABASE_JWT_ISSUER:http://localhost:54321/auth/v1}
    jwks-uri: ${SUPABASE_JWKS_URI:http://localhost:54321/auth/v1/.well-known/jwks.json}
    jwt-audience: ${SUPABASE_JWT_AUDIENCE:authenticated}
    secret-key: ${SUPABASE_SECRET_KEY:}
